# Mock configuration file for testing
app_name: "MockService"
version: 1.2.0
debug_mode: true
max_connections: 50

server:
  host: "127.0.0.1"
  port: 8080
  timeout_seconds: 30

database:
  driver: "postgresql"
  name: "test_db"
  credentials:
    username: "admin"
    password: "super_secret_password" # Change in production

users:
